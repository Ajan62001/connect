[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connect"
version = "0.1.0"
description = "connect — information intelligence system (backend)"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "curl_cffi",
    "trafilatura",
    "pymupdf",
    "feedparser",
    "lxml",
    "rapidfuzz",
    "pillow",
    "sse-starlette",
    "pydantic>=2",
    "pydantic-settings",
    "python-multipart",
    "psycopg[binary]",
    "psycopg_pool",
    "pgvector",
    "authlib",
    "itsdangerous",
    "limits",
    "fastembed",
    "anthropic",
    "langfuse>=3",
    "openpyxl",
    "xlrd",
    "python-docx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
# Optional local TTS for reel narration. Absent => reels render silently
# (see connect/social/tts.py). Kept out of base deps so the default install
# stays lean; the Docker image installs it and bakes a voice model.
tts = [
    "piper-tts",
]

[tool.setuptools.packages.find]
include = ["connect*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# the evals harness (backend/evals/) is a top-level package that is not part
# of the installed `connect` distribution; tests import it via the repo root
pythonpath = ["."]
